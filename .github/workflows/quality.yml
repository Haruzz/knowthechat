name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Install locked dependencies
        run: npm ci
      - name: Install locked Python dependencies
        run: uv sync --project backend --locked --dev
      - name: Pre-commit
        run: npm run precommit:check
      - name: Type checks
        run: npm run typecheck
      - name: Tests
        run: npm run test

  build:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Install locked dependencies
        run: npm ci
      - name: Install locked Python dependencies
        run: uv sync --project backend --locked --dev
      - name: Build application and validate Worker bundle
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: npm run deploy:dry-run
      - name: Build and deploy production Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
